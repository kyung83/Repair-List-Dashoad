name: Equipment Audit

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/equipment-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_CSV_URL: https://docs.google.com/spreadsheets/d/1_YhZodgIiBSQDClR4kP3VGzCoj71rR6w0qYCXiivd2s/export?format=csv&gid=882640692
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production against source snapshot
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#Bearer}"
          token="${token#\"}"
          token="${token%\"}"
          export CLOUDFLARE_API_TOKEN="$token"
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          list_json="$(npx wrangler d1 list --json "${account_args[@]}")"
          db_id="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8"));const r=d.find(x=>x.name==="norlow-repair-production");if(r)process.stdout.write(r.uuid||r.id||r.database_id||"");' <<<"$list_json")"
          test -n "$db_id"
          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$db_id/g" wrangler.template.jsonc > wrangler.audit.jsonc
          curl -fsSL --retry 3 --retry-delay 2 "$SOURCE_CSV_URL" -o /tmp/master.csv
          npx wrangler d1 execute DB --remote --config wrangler.audit.jsonc --command "SELECT id,unit,equipment_type,active,model,model_year,engine,vin,esn,tire_size FROM equipment WHERE active=1 AND equipment_type IN ('truck','trailer') ORDER BY id;" --json > /tmp/prod.json
          python - <<'PY'
          import csv,json,re,sys
          def c(v): return (v or '').strip()
          def prod_key(v):
              s=c(v)
              return c(s.split('(',1)[0]) if '(' in s else s
          with open('/tmp/master.csv',newline='',encoding='utf-8-sig') as f: rows=list(csv.reader(f))
          src_trucks={}
          src_trailers={}
          for r in rows[1:]:
              r=r+['']*(14-len(r))
              if c(r[6]):
                  u=c(r[6]); src_trucks[u]={'model':c(r[9]),'year':c(r[7]),'engine':c(r[8]),'vin':c(r[10]),'esn':c(r[13])}
              if c(r[0]):
                  src_trailers[c(r[0])]={'yearmake':c(r[1]),'vin':c(r[2]),'tire':c(r[4])}
          data=json.load(open('/tmp/prod.json'))
          prod=[r for b in data for r in (b.get('results') or [])]
          matched_trucks=0; model_mismatch=[]; truck_blank=[]
          for e in [x for x in prod if x.get('equipment_type')=='truck']:
              pu=prod_key(e.get('unit'))
              s=src_trucks.get(pu) or src_trucks.get(c(e.get('unit')))
              if not s: continue
              matched_trucks+=1
              if s['model'] and c(e.get('model')) != s['model']: model_mismatch.append((e.get('unit'),s['model'],c(e.get('model'))))
              for sf,ef in [('year','model_year'),('engine','engine'),('vin','vin'),('esn','esn')]:
                  if s[sf] and not c(str(e.get(ef) if e.get(ef) is not None else '')): truck_blank.append((e.get('unit'),ef))
          matched_trailers=0; trailer_blank=[]
          for e in [x for x in prod if x.get('equipment_type')=='trailer']:
              s=src_trailers.get(c(e.get('unit')))
              if not s: continue
              matched_trailers+=1
              if s['vin'] and not c(e.get('vin')): trailer_blank.append((e.get('unit'),'vin'))
              if s['tire'] and not c(e.get('tire_size')): trailer_blank.append((e.get('unit'),'tire_size'))
              m=re.match(r'^(19|20)\d{2}\b',s['yearmake'])
              if m and e.get('model_year') is None: trailer_blank.append((e.get('unit'),'model_year'))
          print('MATCHED_TRUCKS='+str(matched_trucks))
          print('MODEL_MISMATCHES='+str(len(model_mismatch)))
          print('TRUCK_SOURCE_FIELDS_BLANK='+str(len(truck_blank)))
          print('MATCHED_TRAILERS='+str(matched_trailers))
          print('TRAILER_SOURCE_FIELDS_BLANK='+str(len(trailer_blank)))
          if model_mismatch:
              for x in model_mismatch[:20]: print('MODEL_MISMATCH='+repr(x))
          if truck_blank:
              for x in truck_blank[:20]: print('TRUCK_BLANK='+repr(x))
          if trailer_blank:
              for x in trailer_blank[:20]: print('TRAILER_BLANK='+repr(x))
          if matched_trucks < 275 or model_mismatch or truck_blank or matched_trailers < 550 or trailer_blank:
              sys.exit(1)
          PY
