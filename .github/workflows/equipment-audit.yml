name: Equipment Audit

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/equipment-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect unmatched equipment records
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#Bearer}"
          token="${token#\"}"
          token="${token%\"}"
          export CLOUDFLARE_API_TOKEN="$token"
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          list_json="$(npx wrangler d1 list --json "${account_args[@]}")"
          db_id="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8"));const r=d.find(x=>x.name==="norlow-repair-production");if(r)process.stdout.write(r.uuid||r.id||r.database_id||"");' <<<"$list_json")"
          test -n "$db_id"
          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$db_id/g" wrangler.template.jsonc > wrangler.audit.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.audit.jsonc --command "SELECT id,unit,equipment_type,active,archived_at,model FROM equipment WHERE trim(unit) GLOB '247*' OR trim(unit) GLOB '370*' OR trim(unit) GLOB '673*' OR trim(unit) GLOB '674*' OR trim(unit) GLOB '675*' OR trim(unit) GLOB '676*' OR trim(unit) GLOB '677*' OR trim(unit) GLOB '678*' ORDER BY unit;" --json > /tmp/check.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/check.json','utf8'));
          const rows=d.flatMap(x=>x.results||[]);
          console.log('FOUND_RECORDS='+rows.length);
          for(const row of rows) console.log(JSON.stringify(row));
          NODE
