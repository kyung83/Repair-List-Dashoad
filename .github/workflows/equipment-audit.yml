name: Equipment Audit

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/equipment-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect production equipment unit naming
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#Bearer}"
          token="${token#\"}"
          token="${token%\"}"
          export CLOUDFLARE_API_TOKEN="$token"
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          list_json="$(npx wrangler d1 list --json "${account_args[@]}")"
          db_id="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8"));const r=d.find(x=>x.name==="norlow-repair-production");if(r)process.stdout.write(r.uuid||r.id||r.database_id||"");' <<<"$list_json")"
          test -n "$db_id"
          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$db_id/g" wrangler.template.jsonc > wrangler.audit.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.audit.jsonc --command "SELECT id,unit,equipment_type,model FROM equipment WHERE active=1 AND equipment_type='truck' ORDER BY id LIMIT 120;" --json > /tmp/units.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/units.json','utf8'));
          for(const row of d.flatMap(x=>x.results||[])) console.log(JSON.stringify(row));
          NODE
