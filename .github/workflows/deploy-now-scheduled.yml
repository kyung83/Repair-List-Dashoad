name: One-time Norlow Production Deploy

on:
  schedule:
    - cron: '5 16 26 8 *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Bootstrap Cloudflare on latest main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-bootstrap.yml --ref main
