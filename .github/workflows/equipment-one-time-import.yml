name: One-Time Equipment Master Import

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/equipment-one-time-import.yml

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_CSV_URL: https://docs.google.com/spreadsheets/d/1_YhZodgIiBSQDClR4kP3VGzCoj71rR6w0qYCXiivd2s/export?format=csv&gid=882640692
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch one-time source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$SOURCE_CSV_URL" -o /tmp/master-equipment.csv
          python - <<'PY'
          import csv
          with open('/tmp/master-equipment.csv', newline='', encoding='utf-8-sig') as f:
              rows=list(csv.reader(f))
          if not rows or len(rows[0]) < 14:
              raise SystemExit('Master Equipment Info CSV is missing expected columns')
          h=rows[0]
          expected={6:'Truck #',7:'YEAR',8:'ENGINE',9:'MODEL',10:'VIN',13:'esn'}
          for idx,name in expected.items():
              if h[idx].strip().lower()!=name.lower():
                  raise SystemExit(f'Unexpected source header at column {idx+1}: {h[idx]!r}')
          truck=sum(1 for r in rows[1:] if len(r)>9 and r[6].strip() and r[9].strip())
          if truck < 280:
              raise SystemExit(f'Source truck model rows look incomplete: {truck}')
          print(f'SOURCE_TRUCK_MODEL_ROWS={truck}')
          PY

      - name: Build normalized truck-model import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,re

          def clean(v): return (v or '').strip()
          def sqlq(v): return 'NULL' if not v else "'" + v.replace("'", "''") + "'"
          def year(v):
              s=clean(v)
              return int(s) if s.isdigit() and 1900 <= int(s) <= 2100 else None
          def unit_key(v):
              m=re.match(r'\s*(\d+)', clean(v))
              return m.group(1) if m else ''

          trucks={}
          with open('/tmp/master-equipment.csv', newline='', encoding='utf-8-sig') as f:
              rows=list(csv.reader(f))
          for row in rows[1:]:
              row=row+['']*(14-len(row))
              key=unit_key(row[6])
              model=clean(row[9])
              if not key or not model:
                  continue
              trucks[key]=(year(row[7]),clean(row[8]),model,clean(row[10]),clean(row[13]))

          out=['PRAGMA foreign_keys = ON;','DROP TABLE IF EXISTS _truck_model_stage_20260812;',
               'CREATE TABLE _truck_model_stage_20260812 (unit_key TEXT PRIMARY KEY, model_year INTEGER, engine TEXT, model TEXT NOT NULL, vin TEXT, esn TEXT);']
          vals=[]
          for key,(yr,engine,model,vin,esn) in sorted(trucks.items(), key=lambda x:int(x[0])):
              vals.append('(' + ','.join([sqlq(key),str(yr) if yr is not None else 'NULL',sqlq(engine),sqlq(model),sqlq(vin),sqlq(esn)]) + ')')
          for start in range(0,len(vals),100):
              out.append('INSERT INTO _truck_model_stage_20260812 (unit_key,model_year,engine,model,vin,esn) VALUES\n  '+',\n  '.join(vals[start:start+100])+';')

          match="s.unit_key = substr(trim(e.unit),1,instr(trim(e.unit),'(')-1)"
          out.append(f"""
          UPDATE equipment AS e
          SET
            model = (SELECT s.model FROM _truck_model_stage_20260812 s WHERE {match}),
            model_year = CASE WHEN e.model_year IS NULL THEN (SELECT s.model_year FROM _truck_model_stage_20260812 s WHERE {match}) ELSE e.model_year END,
            engine = CASE WHEN e.engine IS NULL OR trim(e.engine)='' THEN (SELECT s.engine FROM _truck_model_stage_20260812 s WHERE {match}) ELSE e.engine END,
            vin = CASE WHEN e.vin IS NULL OR trim(e.vin)='' THEN (SELECT s.vin FROM _truck_model_stage_20260812 s WHERE {match}) ELSE e.vin END,
            esn = CASE WHEN e.esn IS NULL OR trim(e.esn)='' THEN (SELECT s.esn FROM _truck_model_stage_20260812 s WHERE {match}) ELSE e.esn END,
            updated_at = CURRENT_TIMESTAMP
          WHERE e.active=1 AND e.equipment_type='truck' AND instr(trim(e.unit),'(')>1
            AND EXISTS (SELECT 1 FROM _truck_model_stage_20260812 s WHERE {match});
          """.strip())
          with open('/tmp/truck-model-import.sql','w',encoding='utf-8') as f: f.write('\n\n'.join(out)+'\n')
          print(f'STAGED_TRUCK_MODELS={len(trucks)}')
          PY

      - name: Apply model values to production D1
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#Bearer}"
          token="${token#\"}"
          token="${token%\"}"
          export CLOUDFLARE_API_TOKEN="$token"
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          list_json="$(npx wrangler d1 list --json "${account_args[@]}")"
          db_id="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(0,"utf8")); const r=d.find(x=>x.name==="norlow-repair-production"); if(r) process.stdout.write(r.uuid||r.id||r.database_id||"");' <<<"$list_json")"
          test -n "$db_id"
          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$db_id/g" wrangler.template.jsonc > wrangler.truck-model.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.truck-model.jsonc --file /tmp/truck-model-import.sql --yes

      - name: Verify sheet model is now authoritative
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.truck-model.jsonc --command "SELECT COUNT(*) AS matched_trucks, SUM(CASE WHEN lower(trim(e.model))<>lower(trim(s.model)) THEN 1 ELSE 0 END) AS model_mismatches, SUM(CASE WHEN lower(s.model) LIKE '%day%' THEN 1 ELSE 0 END) AS day_cab_models, SUM(CASE WHEN lower(s.model) LIKE '%sleep%' THEN 1 ELSE 0 END) AS sleeper_models FROM equipment e JOIN _truck_model_stage_20260812 s ON instr(trim(e.unit),'(')>1 AND s.unit_key=substr(trim(e.unit),1,instr(trim(e.unit),'(')-1) WHERE e.active=1 AND e.equipment_type='truck';" --json > /tmp/verify.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const r=d.flatMap(x=>x.results||[])[0]||{};
          console.log(`MATCHED_TRUCKS=${r.matched_trucks ?? 'unknown'}`);
          console.log(`MODEL_MISMATCHES=${r.model_mismatches ?? 'unknown'}`);
          console.log(`DAY_CAB_MODELS=${r.day_cab_models ?? 'unknown'}`);
          console.log(`SLEEPER_MODELS=${r.sleeper_models ?? 'unknown'}`);
          if (Number(r.matched_trucks||0) < 280 || Number(r.model_mismatches||0)!==0) process.exit(1);
          NODE

      - name: Remove temporary staging table
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f wrangler.truck-model.jsonc ]; then
            npx wrangler d1 execute DB --remote --config wrangler.truck-model.jsonc --command "DROP TABLE IF EXISTS _truck_model_stage_20260812;" --json >/dev/null 2>&1
          fi
