name: PM Baseline Diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/pm-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Validate tractor rotating PM sequence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function normalizeToken(raw) {
            return String(raw || '').trim().replace(/^CLOUDFLARE_API_TOKEN=/, '').replace(/^Bearer\s*/i, '').replace(/^"|"$/g, '');
          }
          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error((body.errors || []).map((e) => e.message || e.code).join('; ') || response.statusText);
            return body.result;
          }
          async function findDb() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database not found.');
          }
          (async () => {
            const { accountId, databaseId } = await findDb();
            const url = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
            async function query(sql, params = []) {
              const result = await api(url, { method: 'POST', body: JSON.stringify({ sql, params }) });
              return result?.[0]?.results || result?.results || [];
            }
            const recoverable = await query(`
              WITH tractors AS (
                SELECT e.id AS equipment_id, ps.service_date
                FROM equipment e
                JOIN pm_status ps ON ps.equipment_id = e.id
                JOIN equipment_pm_settings s ON s.equipment_id = e.id
                JOIN pm_profiles p ON p.id = s.profile_id
                WHERE e.active = 1 AND e.category = 'Tractors'
                  AND p.name = 'Rotating 40-20A-20B'
                  AND ps.service_date IS NOT NULL
              ), anchors AS (
                SELECT t.equipment_id, t.service_date,
                  (
                    SELECT MAX(h.ro_date)
                    FROM historical_repair_lines h
                    WHERE h.equipment_id = t.equipment_id
                      AND h.ro_date <= t.service_date
                      AND (UPPER(h.vmrs_description) LIKE '%PM40%' OR UPPER(h.vmrs_description) LIKE '%PM 40%' OR UPPER(h.vmrs_description) LIKE '%40 PM%')
                  ) AS last_pm40_date
                FROM tractors t
              ), classified AS (
                SELECT a.equipment_id, a.service_date, a.last_pm40_date,
                  CASE WHEN EXISTS (
                    SELECT 1 FROM historical_repair_lines h
                    WHERE h.equipment_id = a.equipment_id AND h.ro_date = a.service_date
                      AND (UPPER(h.vmrs_description) LIKE '%PM40%' OR UPPER(h.vmrs_description) LIKE '%PM 40%' OR UPPER(h.vmrs_description) LIKE '%40 PM%')
                  ) THEN 1 ELSE 0 END AS baseline_is_pm40,
                  CASE WHEN EXISTS (
                    SELECT 1 FROM historical_repair_lines h
                    WHERE h.equipment_id = a.equipment_id AND h.ro_date = a.service_date
                      AND UPPER(h.vmrs_description) LIKE '%PM20%'
                  ) THEN 1 ELSE 0 END AS baseline_is_pm20,
                  (
                    SELECT COUNT(DISTINCT h.ro_number)
                    FROM historical_repair_lines h
                    WHERE h.equipment_id = a.equipment_id
                      AND a.last_pm40_date IS NOT NULL
                      AND h.ro_date > a.last_pm40_date
                      AND h.ro_date <= a.service_date
                      AND UPPER(h.vmrs_description) LIKE '%PM20%'
                  ) AS pm20_after_anchor
                FROM anchors a
              ), resolved AS (
                SELECT *, CASE
                  WHEN baseline_is_pm40 = 1 THEN '20A'
                  WHEN baseline_is_pm20 = 1 AND pm20_after_anchor = 1 THEN '20B'
                  WHEN baseline_is_pm20 = 1 AND pm20_after_anchor = 2 THEN '40'
                  ELSE NULL
                END AS recovered_next
                FROM classified
              )
              SELECT COALESCE(recovered_next, '(unresolved)') AS recovered_next,
                     COUNT(*) AS count
              FROM resolved
              GROUP BY COALESCE(recovered_next, '(unresolved)')
              ORDER BY recovered_next
            `);
            const integrity = await query(`
              WITH tractors AS (
                SELECT e.id AS equipment_id, ps.service_date
                FROM equipment e
                JOIN pm_status ps ON ps.equipment_id = e.id
                JOIN equipment_pm_settings s ON s.equipment_id = e.id
                JOIN pm_profiles p ON p.id = s.profile_id
                WHERE e.active = 1 AND e.category = 'Tractors'
                  AND p.name = 'Rotating 40-20A-20B'
                  AND ps.service_date IS NOT NULL
              ), anchors AS (
                SELECT t.equipment_id, t.service_date,
                  (SELECT MAX(h.ro_date) FROM historical_repair_lines h WHERE h.equipment_id=t.equipment_id AND h.ro_date<=t.service_date AND UPPER(h.vmrs_description) LIKE '%PM40%') AS last_pm40_date
                FROM tractors t
              )
              SELECT COUNT(*) AS baselines,
                     SUM(CASE WHEN last_pm40_date IS NULL THEN 1 ELSE 0 END) AS without_anchor,
                     SUM(CASE WHEN EXISTS (SELECT 1 FROM historical_repair_lines h WHERE h.equipment_id=a.equipment_id AND h.ro_date=a.service_date AND (UPPER(h.vmrs_description) LIKE '%PM20%' OR UPPER(h.vmrs_description) LIKE '%PM40%')) THEN 1 ELSE 0 END) AS baseline_labeled_pm
              FROM anchors a
            `);
            console.log('TRACTOR_RECOVERED_NEXT=' + JSON.stringify(recoverable));
            console.log('TRACTOR_SEQUENCE_INTEGRITY=' + JSON.stringify(integrity));
          })().catch((error) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          NODE
