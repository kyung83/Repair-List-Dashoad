name: PM Baseline Diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/pm-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Check unresolved tractor PM date offsets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function normalizeToken(raw) { return String(raw || '').trim().replace(/^CLOUDFLARE_API_TOKEN=/, '').replace(/^Bearer\s*/i, '').replace(/^"|"$/g, ''); }
          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { ...options, headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) } });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error((body.errors || []).map((e) => e.message || e.code).join('; ') || response.statusText);
            return body.result;
          }
          async function findDb() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database not found.');
          }
          (async () => {
            const { accountId, databaseId } = await findDb();
            const url = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
            async function query(sql, params = []) { const result = await api(url, { method: 'POST', body: JSON.stringify({ sql, params }) }); return result?.[0]?.results || result?.results || []; }
            const result = await query(`
              WITH pm_events AS (
                SELECT h.equipment_id, h.ro_date,
                  CASE WHEN UPPER(h.vmrs_description) LIKE '%PM40%' OR UPPER(h.vmrs_description) LIKE '%PM 40%' OR UPPER(h.vmrs_description) LIKE '%40 PM%' THEN '40'
                       WHEN UPPER(h.vmrs_description) LIKE '%PM20%' THEN '20'
                       ELSE NULL END AS event_kind
                FROM historical_repair_lines h
                WHERE UPPER(h.vmrs_description) LIKE '%PM%'
              ), tractors AS (
                SELECT e.id AS equipment_id, ps.service_date
                FROM equipment e
                JOIN pm_status ps ON ps.equipment_id=e.id
                JOIN equipment_pm_settings s ON s.equipment_id=e.id
                JOIN pm_profiles p ON p.id=s.profile_id
                WHERE e.active=1 AND e.category='Tractors' AND p.name='Rotating 40-20A-20B' AND ps.service_date IS NOT NULL
              ), exact_class AS (
                SELECT t.*,
                  (SELECT MAX(h.ro_date) FROM pm_events h WHERE h.equipment_id=t.equipment_id AND h.event_kind='40' AND h.ro_date<=t.service_date) AS anchor,
                  CASE WHEN EXISTS(SELECT 1 FROM pm_events h WHERE h.equipment_id=t.equipment_id AND h.ro_date=t.service_date AND h.event_kind='40') THEN 1 ELSE 0 END AS is40,
                  CASE WHEN EXISTS(SELECT 1 FROM pm_events h WHERE h.equipment_id=t.equipment_id AND h.ro_date=t.service_date AND h.event_kind='20') THEN 1 ELSE 0 END AS is20
                FROM tractors t
              ), unresolved AS (
                SELECT * FROM exact_class x
                WHERE NOT (is40=1 OR (is20=1 AND anchor IS NOT NULL AND (SELECT COUNT(*) FROM pm_events h WHERE h.equipment_id=x.equipment_id AND h.event_kind='20' AND h.ro_date>anchor AND h.ro_date<=x.service_date) IN (1,2)))
              ), candidates AS (
                SELECT u.equipment_id, u.service_date, p.ro_date, p.event_kind,
                       ABS(julianday(p.ro_date)-julianday(u.service_date)) AS delta,
                       ROW_NUMBER() OVER (PARTITION BY u.equipment_id ORDER BY ABS(julianday(p.ro_date)-julianday(u.service_date)), p.ro_date DESC) AS rn,
                       COUNT(*) OVER (PARTITION BY u.equipment_id, ABS(julianday(p.ro_date)-julianday(u.service_date))) AS tied
                FROM unresolved u
                JOIN pm_events p ON p.equipment_id=u.equipment_id AND p.event_kind IN ('20','40')
              ), nearest AS (
                SELECT * FROM candidates WHERE rn=1
              ), inferred AS (
                SELECT n.*,
                  (SELECT MAX(p.ro_date) FROM pm_events p WHERE p.equipment_id=n.equipment_id AND p.event_kind='40' AND p.ro_date<=n.ro_date) AS anchor40
                FROM nearest n
              ), classified AS (
                SELECT i.*,
                  (SELECT COUNT(*) FROM pm_events p WHERE p.equipment_id=i.equipment_id AND p.event_kind='20' AND i.anchor40 IS NOT NULL AND p.ro_date>i.anchor40 AND p.ro_date<=i.ro_date) AS pm20_after_anchor,
                  CASE WHEN i.delta<=7 AND i.tied=1 AND i.event_kind='40' THEN '20A'
                       WHEN i.delta<=7 AND i.tied=1 AND i.event_kind='20' AND (SELECT COUNT(*) FROM pm_events p WHERE p.equipment_id=i.equipment_id AND p.event_kind='20' AND i.anchor40 IS NOT NULL AND p.ro_date>i.anchor40 AND p.ro_date<=i.ro_date)=1 THEN '20B'
                       WHEN i.delta<=7 AND i.tied=1 AND i.event_kind='20' AND (SELECT COUNT(*) FROM pm_events p WHERE p.equipment_id=i.equipment_id AND p.event_kind='20' AND i.anchor40 IS NOT NULL AND p.ro_date>i.anchor40 AND p.ro_date<=i.ro_date)=2 THEN '40'
                       ELSE NULL END AS recovered_next
                FROM inferred i
              )
              SELECT COALESCE(recovered_next,'(unresolved)') AS recovered_next,
                     CASE WHEN delta<=1 THEN '0-1d' WHEN delta<=3 THEN '2-3d' WHEN delta<=7 THEN '4-7d' ELSE '8+d' END AS distance,
                     COUNT(*) AS count
              FROM classified
              GROUP BY COALESCE(recovered_next,'(unresolved)'), distance
              ORDER BY recovered_next, distance
            `);
            console.log('TRACTOR_OFFSET_RECOVERY=' + JSON.stringify(result));
          })().catch((error) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          NODE
