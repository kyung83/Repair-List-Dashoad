name: PM Baseline Diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/pm-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Inspect aggregate PM baselines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function normalizeToken(raw) {
            return String(raw || '').trim().replace(/^CLOUDFLARE_API_TOKEN=/, '').replace(/^Bearer\s*/i, '').replace(/^"|"$/g, '');
          }
          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error((body.errors || []).map((e) => e.message || e.code).join('; ') || response.statusText);
            return body.result;
          }
          async function findDb() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database not found.');
          }
          (async () => {
            const { accountId, databaseId } = await findDb();
            const url = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
            async function query(sql, params = []) {
              const result = await api(url, { method: 'POST', body: JSON.stringify({ sql, params }) });
              return result?.[0]?.results || result?.results || [];
            }
            const summary = await query(`
              SELECT e.category,
                     COUNT(*) AS total,
                     SUM(CASE WHEN s.profile_id IS NOT NULL THEN 1 ELSE 0 END) AS configured,
                     SUM(CASE WHEN ps.service_date IS NULL AND e.service_date IS NULL THEN 1 ELSE 0 END) AS missing_service,
                     SUM(CASE WHEN ps.last_mileage IS NULL THEN 1 ELSE 0 END) AS missing_mileage,
                     SUM(CASE WHEN ps.status = 'Scheduled' THEN 1 ELSE 0 END) AS scheduled,
                     SUM(CASE WHEN ps.status = 'Scheduled' AND ps.service_date = DATE(ps.updated_at) THEN 1 ELSE 0 END) AS scheduled_same_day,
                     SUM(CASE WHEN ps.status = 'Scheduled'
                                   AND ps.service_date IS NOT NULL
                                   AND e.service_date IS NULL
                                   AND NOT EXISTS (
                                     SELECT 1 FROM maintenance_events me
                                     WHERE me.equipment_id = e.id AND me.event_type = 'pm'
                                   )
                              THEN 1 ELSE 0 END) AS pm_status_only_no_event,
                     SUM(CASE WHEN ps.status = 'Scheduled'
                                   AND ps.service_date = DATE(ps.updated_at)
                                   AND e.service_date IS NULL
                                   AND NOT EXISTS (
                                     SELECT 1 FROM maintenance_events me
                                     WHERE me.equipment_id = e.id AND me.event_type = 'pm'
                                   )
                              THEN 1 ELSE 0 END) AS strong_synthetic
              FROM equipment e
              LEFT JOIN equipment_pm_settings s ON s.equipment_id = e.id
              LEFT JOIN pm_status ps ON ps.equipment_id = e.id
              WHERE e.active = 1 AND e.category IN ('Shuttle Trucks', 'Tractors')
              GROUP BY e.category
              ORDER BY e.category
            `);
            const sequence = await query(`
              SELECT e.category, COALESCE(p.name, 'No profile') AS profile,
                     COALESCE(ps.pm_type, '(blank)') AS next_pm, COUNT(*) AS count
              FROM equipment e
              LEFT JOIN equipment_pm_settings s ON s.equipment_id = e.id
              LEFT JOIN pm_profiles p ON p.id = s.profile_id
              LEFT JOIN pm_status ps ON ps.equipment_id = e.id
              WHERE e.active = 1 AND e.category IN ('Shuttle Trucks', 'Tractors')
              GROUP BY e.category, COALESCE(p.name, 'No profile'), COALESCE(ps.pm_type, '(blank)')
              ORDER BY e.category, profile, next_pm
            `);
            const dateShape = await query(`
              SELECT e.category, ps.service_date, COUNT(*) AS count,
                     SUM(CASE WHEN e.service_date IS NULL THEN 1 ELSE 0 END) AS equipment_date_blank,
                     SUM(CASE WHEN EXISTS (
                       SELECT 1 FROM maintenance_events me WHERE me.equipment_id = e.id AND me.event_type = 'pm'
                     ) THEN 1 ELSE 0 END) AS with_pm_event
              FROM equipment e
              JOIN pm_status ps ON ps.equipment_id = e.id
              WHERE e.active = 1 AND e.category IN ('Shuttle Trucks', 'Tractors')
              GROUP BY e.category, ps.service_date
              ORDER BY e.category, ps.service_date
            `);
            console.log('PM_BASELINE_SUMMARY=' + JSON.stringify(summary));
            console.log('PM_SEQUENCE_SUMMARY=' + JSON.stringify(sequence));
            console.log('PM_DATE_SHAPE=' + JSON.stringify(dateShape));
          })().catch((error) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          NODE
