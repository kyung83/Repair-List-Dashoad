name: PM Baseline Diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/pm-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Inspect tractor PM subtype evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function normalizeToken(raw) {
            return String(raw || '').trim().replace(/^CLOUDFLARE_API_TOKEN=/, '').replace(/^Bearer\s*/i, '').replace(/^"|"$/g, '');
          }
          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error((body.errors || []).map((e) => e.message || e.code).join('; ') || response.statusText);
            return body.result;
          }
          async function findDb() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database not found.');
          }
          (async () => {
            const { accountId, databaseId } = await findDb();
            const url = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
            async function query(sql, params = []) {
              const result = await api(url, { method: 'POST', body: JSON.stringify({ sql, params }) });
              return result?.[0]?.results || result?.results || [];
            }
            const eventTypes = await query(`
              SELECT COALESCE(me.source, '(null)') AS source,
                     COALESCE(me.pm_type, '(null)') AS pm_type,
                     COUNT(*) AS count
              FROM maintenance_events me
              JOIN equipment e ON e.id = me.equipment_id
              WHERE e.active = 1 AND e.category = 'Tractors' AND me.event_type = 'pm'
              GROUP BY COALESCE(me.source, '(null)'), COALESCE(me.pm_type, '(null)')
              ORDER BY source, pm_type
            `);
            const historySignals = await query(`
              SELECT
                SUM(CASE WHEN UPPER(vmrs_description) LIKE '%20A%' THEN 1 ELSE 0 END) AS lines_20a,
                SUM(CASE WHEN UPPER(vmrs_description) LIKE '%20B%' THEN 1 ELSE 0 END) AS lines_20b,
                SUM(CASE WHEN UPPER(vmrs_description) LIKE '%PM 40%' OR UPPER(vmrs_description) LIKE '%PM40%' OR UPPER(vmrs_description) LIKE '%40 PM%' THEN 1 ELSE 0 END) AS lines_40,
                COUNT(DISTINCT CASE WHEN UPPER(vmrs_description) LIKE '%20A%' THEN equipment_id END) AS units_20a,
                COUNT(DISTINCT CASE WHEN UPPER(vmrs_description) LIKE '%20B%' THEN equipment_id END) AS units_20b,
                COUNT(DISTINCT CASE WHEN UPPER(vmrs_description) LIKE '%PM 40%' OR UPPER(vmrs_description) LIKE '%PM40%' OR UPPER(vmrs_description) LIKE '%40 PM%' THEN equipment_id END) AS units_40
              FROM historical_repair_lines h
              WHERE EXISTS (
                SELECT 1 FROM equipment e
                WHERE e.id = h.equipment_id AND e.active = 1 AND e.category = 'Tractors'
              )
            `);
            const recentSignals = await query(`
              SELECT
                SUM(CASE WHEN UPPER(COALESCE(title,'') || ' ' || COALESCE(description,'')) LIKE '%20A%' THEN 1 ELSE 0 END) AS repairs_20a,
                SUM(CASE WHEN UPPER(COALESCE(title,'') || ' ' || COALESCE(description,'')) LIKE '%20B%' THEN 1 ELSE 0 END) AS repairs_20b,
                SUM(CASE WHEN UPPER(COALESCE(title,'') || ' ' || COALESCE(description,'')) LIKE '%PM 40%' OR UPPER(COALESCE(title,'') || ' ' || COALESCE(description,'')) LIKE '%PM40%' OR UPPER(COALESCE(title,'') || ' ' || COALESCE(description,'')) LIKE '%40 PM%' THEN 1 ELSE 0 END) AS repairs_40
              FROM repairs r
              WHERE EXISTS (
                SELECT 1 FROM equipment e
                WHERE e.id = r.equipment_id AND e.active = 1 AND e.category = 'Tractors'
              )
            `);
            const latestHistory = await query(`
              WITH labeled AS (
                SELECT h.equipment_id, h.ro_date,
                  CASE
                    WHEN UPPER(h.vmrs_description) LIKE '%20A%' THEN '20A'
                    WHEN UPPER(h.vmrs_description) LIKE '%20B%' THEN '20B'
                    WHEN UPPER(h.vmrs_description) LIKE '%PM 40%' OR UPPER(h.vmrs_description) LIKE '%PM40%' OR UPPER(h.vmrs_description) LIKE '%40 PM%' THEN '40'
                    ELSE NULL
                  END AS completed_pm
                FROM historical_repair_lines h
                JOIN equipment e ON e.id = h.equipment_id
                WHERE e.active = 1 AND e.category = 'Tractors'
              ), ranked AS (
                SELECT equipment_id, completed_pm, ro_date,
                       ROW_NUMBER() OVER (PARTITION BY equipment_id ORDER BY ro_date DESC) AS rn
                FROM labeled
                WHERE completed_pm IS NOT NULL
              )
              SELECT completed_pm, COUNT(*) AS units
              FROM ranked WHERE rn = 1
              GROUP BY completed_pm ORDER BY completed_pm
            `);
            console.log('TRACTOR_EVENT_PM_TYPES=' + JSON.stringify(eventTypes));
            console.log('TRACTOR_HISTORY_SIGNALS=' + JSON.stringify(historySignals));
            console.log('TRACTOR_RECENT_SIGNALS=' + JSON.stringify(recentSignals));
            console.log('TRACTOR_LATEST_HISTORY_LABELS=' + JSON.stringify(latestHistory));
          })().catch((error) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          NODE
