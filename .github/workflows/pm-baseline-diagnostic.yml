name: PM Baseline Diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/pm-baseline-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check authorization
        run: test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Verify tractor PM40 baseline dates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function normalizeToken(raw) {
            return String(raw || '').trim().replace(/^CLOUDFLARE_API_TOKEN=/, '').replace(/^Bearer\s*/i, '').replace(/^"|"$/g, '');
          }
          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) throw new Error((body.errors || []).map((e) => e.message || e.code).join('; ') || response.statusText);
            return body.result;
          }
          async function findDb() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database not found.');
          }
          (async () => {
            const { accountId, databaseId } = await findDb();
            const url = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
            async function query(sql, params = []) {
              const result = await api(url, { method: 'POST', body: JSON.stringify({ sql, params }) });
              return result?.[0]?.results || result?.results || [];
            }
            const matchSummary = await query(`
              WITH pm40 AS (
                SELECT equipment_id, ro_date,
                       ROW_NUMBER() OVER (PARTITION BY equipment_id ORDER BY ro_date DESC, id DESC) AS rn
                FROM historical_repair_lines
                WHERE UPPER(vmrs_description) LIKE '%PM 40%'
                   OR UPPER(vmrs_description) LIKE '%PM40%'
                   OR UPPER(vmrs_description) LIKE '%40 PM%'
              ), tractors AS (
                SELECT e.id, ps.service_date,
                       (SELECT p.ro_date FROM pm40 p WHERE p.equipment_id = e.id AND p.rn = 1) AS latest_pm40_date
                FROM equipment e
                JOIN pm_status ps ON ps.equipment_id = e.id
                WHERE e.active = 1 AND e.category = 'Tractors'
              )
              SELECT
                COUNT(*) AS total,
                SUM(CASE WHEN service_date IS NULL THEN 1 ELSE 0 END) AS baseline_missing,
                SUM(CASE WHEN latest_pm40_date IS NULL THEN 1 ELSE 0 END) AS no_pm40_history,
                SUM(CASE WHEN service_date = latest_pm40_date THEN 1 ELSE 0 END) AS exact_match,
                SUM(CASE WHEN service_date IS NOT NULL AND latest_pm40_date IS NOT NULL AND service_date > latest_pm40_date THEN 1 ELSE 0 END) AS baseline_after_history,
                SUM(CASE WHEN service_date IS NOT NULL AND latest_pm40_date IS NOT NULL AND service_date < latest_pm40_date THEN 1 ELSE 0 END) AS baseline_before_history
              FROM tractors
            `);
            const exactByNext = await query(`
              WITH pm40 AS (
                SELECT equipment_id, ro_date,
                       ROW_NUMBER() OVER (PARTITION BY equipment_id ORDER BY ro_date DESC, id DESC) AS rn
                FROM historical_repair_lines
                WHERE UPPER(vmrs_description) LIKE '%PM 40%'
                   OR UPPER(vmrs_description) LIKE '%PM40%'
                   OR UPPER(vmrs_description) LIKE '%40 PM%'
              )
              SELECT COALESCE(ps.pm_type, '(blank)') AS current_next, COUNT(*) AS count
              FROM equipment e
              JOIN pm_status ps ON ps.equipment_id = e.id
              JOIN pm40 h ON h.equipment_id = e.id AND h.rn = 1 AND h.ro_date = ps.service_date
              WHERE e.active = 1 AND e.category = 'Tractors'
              GROUP BY COALESCE(ps.pm_type, '(blank)')
              ORDER BY current_next
            `);
            console.log('TRACTOR_PM40_DATE_MATCH=' + JSON.stringify(matchSummary));
            console.log('TRACTOR_EXACT_MATCH_CURRENT_NEXT=' + JSON.stringify(exactByNext));
          })().catch((error) => { console.error(error instanceof Error ? error.message : String(error)); process.exit(1); });
          NODE
