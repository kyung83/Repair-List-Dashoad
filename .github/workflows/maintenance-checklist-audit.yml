name: Maintenance Checklist Audit

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - .github/workflows/maintenance-checklist-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify checklist schema and triggers
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#Bearer}"
          token="${token#\"}"
          token="${token%\"}"
          export CLOUDFLARE_API_TOKEN="$token"
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          list_json="$(npx wrangler d1 list --json "${account_args[@]}")"
          db_id="$(node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8"));const r=d.find(x=>x.name==="norlow-repair-production");if(r)process.stdout.write(r.uuid||r.id||r.database_id||"");' <<<"$list_json")"
          test -n "$db_id"
          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$db_id/g" wrangler.template.jsonc > wrangler.audit.jsonc
          npx wrangler d1 execute DB --remote --config wrangler.audit.jsonc --command "PRAGMA table_info(maintenance_checklist_runs); SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_require_maintenance_checklist_before_complete','trg_advance_pm_after_checklist_work_order','trg_advance_annual_after_checklist_work_order') ORDER BY name;" --json > /tmp/schema.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/schema.json','utf8'));
          const rows=data.flatMap(x=>x.results||[]);
          const cols=new Set(rows.filter(r=>r.name && Object.prototype.hasOwnProperty.call(r,'cid')).map(r=>r.name));
          const triggers=new Set(rows.filter(r=>r.name && !Object.prototype.hasOwnProperty.call(r,'cid')).map(r=>r.name));
          const requiredCols=['mileage_at_start','mileage_at_completion','mileage_source','mileage_updated_at','ready_by_user_id'];
          const requiredTriggers=['trg_require_maintenance_checklist_before_complete','trg_advance_pm_after_checklist_work_order','trg_advance_annual_after_checklist_work_order'];
          for(const name of requiredCols) console.log(`COLUMN_${name.toUpperCase()}=${cols.has(name)}`);
          for(const name of requiredTriggers) console.log(`TRIGGER_${name.toUpperCase()}=${triggers.has(name)}`);
          if(requiredCols.some(x=>!cols.has(x)) || requiredTriggers.some(x=>!triggers.has(x))) process.exit(1);
          console.log('MAINTENANCE_CHECKLIST_SCHEMA_VERIFIED=true');
          NODE
