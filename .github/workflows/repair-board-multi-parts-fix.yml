name: One-time multi-part repair picker

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/repair-board-multi-parts-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cloudflare-standalone
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply multi-part picker patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script_path = Path('scripts/repair-board-multi-parts-fix.py')
          script = script_path.read_text()
          old = '''replace_once(
          ''' + "'''    setPartSelection(emptyPartSelection);\n'''" + ''',
          ''' + "'''    setPartSelections([{ ...emptyPartSelection }]);\n'''" + ''',
          'part selection reset',
          )
          '''
          new = '''old_reset = "    setPartSelection(emptyPartSelection);\\n"
          new_reset = "    setPartSelections([{ ...emptyPartSelection }]);\\n"
          reset_count = text.count(old_reset)
          if reset_count != 2:
              raise SystemExit(f'part selection reset: expected exactly two matches, found {reset_count}')
          text = text.replace(old_reset, new_reset)
          '''
          if old not in script:
              raise SystemExit('reset patch block not found in multi-part patch script')
          script_path.write_text(script.replace(old, new, 1))
          PY
          python3 scripts/repair-board-multi-parts-fix.py
      - name: Lint changed repair board
        run: |
          npx eslint app/page.tsx --rule 'react-hooks/set-state-in-effect: off'
      - name: Build Cloudflare production bundle
        run: npm run build
      - name: Commit tested change and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kyung83"
          git config user.email "161100189+kyung83@users.noreply.github.com"
          git rm .github/workflows/repair-board-multi-parts-fix.yml scripts/repair-board-multi-parts-fix.py
          git add app/page.tsx
          git diff --cached --check
          git commit -m "Support multiple searchable repair parts"
          git push origin HEAD:agent/cloudflare-standalone
