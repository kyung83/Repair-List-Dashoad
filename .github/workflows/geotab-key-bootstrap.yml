name: Bootstrap Geotab Encryption Key

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/geotab-key-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and install private key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Cloudflare is not authorized."
            exit 1
          fi
          mkdir -p /tmp/geotab-key
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/geotab-key/private.pem 2>/dev/null
          openssl pkey -in /tmp/geotab-key/private.pem -pubout -out /tmp/geotab-key/public.pem
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          cat /tmp/geotab-key/private.pem | npx wrangler secret put GEOTAB_CONFIG_PRIVATE_KEY --name norlow-repair-dashboard "${account_args[@]}"
          shred -u /tmp/geotab-key/private.pem
          echo "Cloudflare private key installed."

      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: geotab-config-public-key
          path: /tmp/geotab-key/public.pem
          if-no-files-found: error
          retention-days: 1
