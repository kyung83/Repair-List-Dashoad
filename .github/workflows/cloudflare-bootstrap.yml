name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "lib/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  # Manual dispatch is useful after a workflow-authored commit because GitHub does not
  # trigger downstream workflows from pushes made with the default GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: norlow-cloudflare-bootstrap-v5
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_BOOTSTRAP_TOKEN: ${{ secrets.AUTH_BOOTSTRAP_TOKEN }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized. Add CLOUDFLARE_API_TOKEN and rerun."
          fi

      - name: Mark production deployment pending
        if: steps.auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >/tmp/production-status.json
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: 'production/cloudflare',
            description: 'Cloudflare deployment and D1 migration verification running',
            target_url: process.env.TARGET_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/production-status.json >/dev/null

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Install dashboard bootstrap secret
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUTH_BOOTSTRAP_TOKEN:-}" ]; then
            echo "AUTH_BOOTSTRAP_TOKEN is not set as a GitHub Actions secret. Existing Cloudflare secret, if any, is unchanged."
            exit 0
          fi
          node - <<'NODE' | npx wrangler secret bulk --config wrangler.jsonc --name norlow-repair-dashboard
          process.stdout.write(JSON.stringify({ AUTH_BOOTSTRAP_TOKEN: process.env.AUTH_BOOTSTRAP_TOKEN }));
          NODE
          echo "Dashboard bootstrap secret installed."

      - name: Initialize private Master Truck List import key
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_name="truck-masterlist-rsa-key-v3"

          npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc --json \
            --command "SELECT version_token FROM sync_state WHERE feed_name='$key_name' LIMIT 1" \
            > /tmp/masterlist-existing.json

          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/masterlist-existing.json', 'utf8'));
          function findToken(value) {
            if (!value || typeof value !== 'object') return '';
            if (typeof value.version_token === 'string') return value.version_token;
            if (Array.isArray(value)) {
              for (const item of value) { const found = findToken(item); if (found) return found; }
            } else {
              for (const item of Object.values(value)) { const found = findToken(item); if (found) return found; }
            }
            return '';
          }
          const token = findToken(raw);
          if (token) {
            const bundle = JSON.parse(token);
            if (typeof bundle.publicKey === 'string' && bundle.publicKey.length > 300) {
              fs.writeFileSync('/tmp/masterlist-public-key.txt', bundle.publicKey);
            }
          }
          NODE

          if [ ! -s /tmp/masterlist-public-key.txt ]; then
            node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
            modulusLength: 2048,
            publicKeyEncoding: { type: 'spki', format: 'der' },
            privateKeyEncoding: { type: 'pkcs8', format: 'der' },
          });
          const bundle = {
            alg: 'RSA-OAEP-2048-SHA256',
            publicKey: publicKey.toString('base64'),
            privateKey: privateKey.toString('base64'),
            callToken: crypto.randomBytes(32).toString('base64url'),
          };
          const escaped = JSON.stringify(bundle).replace(/'/g, "''");
          const sql = `INSERT INTO sync_state(feed_name,version_token,last_success_at,last_error)
          VALUES('truck-masterlist-rsa-key-v3','${escaped}',CURRENT_TIMESTAMP,NULL)
          ON CONFLICT(feed_name) DO UPDATE SET version_token=excluded.version_token,last_success_at=CURRENT_TIMESTAMP,last_error=NULL;`;
          fs.writeFileSync('/tmp/masterlist-key.sql', sql);
          fs.writeFileSync('/tmp/masterlist-public-key.txt', bundle.publicKey);
          NODE
            npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc \
              --file /tmp/masterlist-key.sql >/tmp/masterlist-key-write.log
          fi

          public_key="$(cat /tmp/masterlist-public-key.txt)"
          if [ "${#public_key}" -lt 300 ]; then
            echo "Master Truck List import public key is invalid."
            exit 1
          fi
          echo "MASTERLIST_IMPORT_PUBLIC_KEY=$public_key"

      - name: Commit encrypted Master Truck List import
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_name="truck-masterlist-rsa-key-v3"
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"

          npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc --json \
            --command "SELECT version_token FROM sync_state WHERE feed_name='$key_name' LIMIT 1" \
            > /tmp/masterlist-call-bundle.json

          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/masterlist-call-bundle.json', 'utf8'));
          function findToken(value) {
            if (!value || typeof value !== 'object') return '';
            if (typeof value.version_token === 'string') return value.version_token;
            if (Array.isArray(value)) {
              for (const item of value) { const found = findToken(item); if (found) return found; }
            } else {
              for (const item of Object.values(value)) { const found = findToken(item); if (found) return found; }
            }
            return '';
          }
          const token = findToken(raw);
          if (!token) throw new Error('Master Truck List D1 key bundle is missing.');
          const bundle = JSON.parse(token);
          if (typeof bundle.callToken !== 'string' || bundle.callToken.length < 30) throw new Error('Master Truck List call token is invalid.');
          fs.writeFileSync('/tmp/masterlist-call-token.txt', bundle.callToken, { mode: 0o600 });
          NODE

          call_token="$(cat /tmp/masterlist-call-token.txt)"
          status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "x-masterlist-import-token: $call_token" \
            -o /tmp/masterlist-import-result.json -w '%{http_code}' \
            "$site_url/api/private-masterlist-import?mode=commit")"
          if [ "$status" != "200" ]; then
            echo "Master Truck List import returned HTTP $status."
            cat /tmp/masterlist-import-result.json
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/masterlist-import-result.json', 'utf8'));
          if (payload.ok !== true) throw new Error(payload.error || 'Master Truck List import failed.');
          if (payload.alreadyImported) {
            console.log('Master Truck List import was already completed.');
            process.exit(0);
          }
          for (const key of ['totalRows','matched','changed','unmatchedCount','ambiguousCount','preservedActiveSwaps']) {
            if (!Number.isInteger(payload[key])) throw new Error('Master Truck List import summary is invalid.');
          }
          if (payload.preflight === true) throw new Error('Master Truck List commit unexpectedly stayed in preflight mode.');
          console.log(`MASTERLIST_IMPORT_SUMMARY total=${payload.totalRows} matched=${payload.matched} changed=${payload.changed} unmatched=${payload.unmatchedCount} ambiguous=${payload.ambiguousCount} preserved_swaps=${payload.preservedActiveSwaps}`);
          if (!payload.encryptedReport || typeof payload.encryptedReport !== 'object') throw new Error('Encrypted Master Truck List report is missing.');
          const encoded = Buffer.from(JSON.stringify(payload.encryptedReport), 'utf8').toString('base64');
          console.log('MASTERLIST_ENCRYPTED_REPORT_B64=' + encoded);
          NODE

      - name: Verify authentication and deployment health
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"
          expected_release="2026-08-18-working-managers-0078"

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/login" -o /tmp/login.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/setup" -o /tmp/setup.html

          deployment_verified=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --retry 2 --retry-delay 1 --retry-all-errors \
              "$site_url/api/auth/setup" -o /tmp/auth-setup.json; then
              if EXPECTED_RELEASE="$expected_release" node - <<'NODE'
          const fs = require('fs');
          try {
            const status = JSON.parse(fs.readFileSync('/tmp/auth-setup.json', 'utf8'));
            const deployment = status.deployment;
            const valid = typeof status.setupRequired === 'boolean'
              && typeof status.bootstrapConfigured === 'boolean'
              && deployment
              && deployment.release === process.env.EXPECTED_RELEASE
              && deployment.ok === true
              && deployment.pmImport
              && deployment.pmImport.ok === true;
            process.exit(valid ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
              then
                deployment_verified=true
                break
              fi
            fi
            echo "Waiting for deployed release/schema to propagate (attempt $attempt/15)..."
            sleep 2
          done

          if [ "$deployment_verified" != "true" ]; then
            echo "Live Worker did not report the expected release/schema. Last response:"
            cat /tmp/auth-setup.json || true
            exit 1
          fi

          EXPECTED_RELEASE="$expected_release" node - <<'NODE'
          const fs = require('fs');
          const login = fs.readFileSync('/tmp/login.html', 'utf8');
          const setup = fs.readFileSync('/tmp/setup.html', 'utf8');
          const status = JSON.parse(fs.readFileSync('/tmp/auth-setup.json', 'utf8'));
          if (!login.includes('Sign in')) throw new Error('Login page smoke check failed.');
          if (!setup.includes('Create the first administrator') && !setup.includes('ONE-TIME SECURITY SETUP')) {
            throw new Error('Setup page smoke check failed.');
          }
          if (typeof status.setupRequired !== 'boolean' || typeof status.bootstrapConfigured !== 'boolean') {
            throw new Error('Authentication setup status response is invalid.');
          }
          const deployment = status.deployment;
          if (!deployment || deployment.release !== process.env.EXPECTED_RELEASE) {
            throw new Error(`Expected release ${process.env.EXPECTED_RELEASE}, received ${JSON.stringify(deployment)}`);
          }
          if (deployment.ok !== true || !deployment.pmImport || deployment.pmImport.ok !== true) {
            throw new Error(`Production D1/working-manager verification is incomplete: ${JSON.stringify(deployment)}`);
          }
          console.log(`Deployment verified. release=${deployment.release}, migrations=${JSON.stringify(deployment.migrations)}`);
          console.log(`PM import verified. receipt=${JSON.stringify(deployment.pmImport)}`);
          console.log(`Working-manager feature receipt=${deployment.workingManagers?.featureAppliedAt || 'missing'}, currentLinked=${deployment.workingManagers?.linked ?? 0}`);
          console.log(`Authentication setup endpoint ready. setupRequired=${status.setupRequired}, bootstrapConfigured=${status.bootstrapConfigured}`);
          NODE

          root_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$site_url/")"
          if [ "$root_status" != "302" ]; then
            echo "Expected unauthenticated dashboard request to redirect, got HTTP $root_status."
            exit 1
          fi

          for endpoint in /api/repairs /api/repair-board /api/work-orders /api/inventory /api/admin/geotab-reconciliation /api/admin/equipment-merge '/api/repairs?checkGeotab=1'; do
            status="$(curl --silent --show-error -o /tmp/protected.json -w '%{http_code}' "$site_url$endpoint")"
            if [ "$status" != "401" ] && [ "$status" != "503" ]; then
              echo "Protected endpoint $endpoint returned unexpected HTTP $status."
              cat /tmp/protected.json
              exit 1
            fi
          done
          echo "Repair, Repair Board, work-order, inventory, Geotab review, equipment merge, and diagnostic APIs are not publicly readable."

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_READY: ${{ steps.auth.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Cloudflare deployment or D1 schema verification failed"
          if [ "$AUTH_READY" = "true" ] && [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Verified working managers 0078 and production D1"
          elif [ "$AUTH_READY" != "true" ]; then
            description="Cloudflare deployment authorization is missing"
          fi
          STATUS_STATE="$state" STATUS_DESCRIPTION="$description" node - <<'NODE' >/tmp/production-status-final.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATUS_STATE,
            context: 'production/cloudflare',
            description: process.env.STATUS_DESCRIPTION,
            target_url: process.env.TARGET_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/production-status-final.json >/dev/null

