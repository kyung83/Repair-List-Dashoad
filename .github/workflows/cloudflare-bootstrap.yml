name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "lib/**"
      - "build/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norlow-cloudflare-bootstrap-v3
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized. Add CLOUDFLARE_API_TOKEN and rerun."
          fi

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Import protected vendor records
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST "$site_url/api/internal/vendor-bootstrap" -o /tmp/vendor-import.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/vendor-import.json', 'utf8'));
          if (result.ok !== true || result.imported !== 46) {
            throw new Error(`Protected vendor import failed: ${JSON.stringify(result)}`);
          }
          console.log(`Protected vendor import completed for ${result.imported} vendors.`);
          NODE

      - name: Verify live dashboard and Geotab
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/" -o /tmp/dashboard.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/inventory" -o /tmp/inventory.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/api/repairs" -o /tmp/repairs-api.json
          inventory_status="$(curl --silent --show-error -o /tmp/inventory-lock.json -w '%{http_code}' "$site_url/api/inventory")"
          geotab_status="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors -o /tmp/geotab-check.json -w '%{http_code}' "$site_url/api/repairs?checkGeotab=1")"
          echo "Sanitized Geotab diagnostic:"
          cat /tmp/geotab-check.json
          if [ "$inventory_status" != "503" ]; then
            echo "Inventory API was expected to remain locked but returned HTTP $inventory_status."
            exit 1
          fi
          if [ "$geotab_status" != "200" ]; then
            echo "Geotab diagnostic returned HTTP $geotab_status."
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const repairs = JSON.parse(fs.readFileSync('/tmp/repairs-api.json', 'utf8'));
          for (const key of ['repairs', 'dvir', 'pm', 'equipment']) {
            if (!Array.isArray(repairs[key])) throw new Error(`Missing dashboard array: ${key}`);
          }
          if (repairs.geotabConfigured !== true) throw new Error('Encrypted Geotab configuration is not active');
          const diagnostic = JSON.parse(fs.readFileSync('/tmp/geotab-check.json', 'utf8'));
          if (diagnostic.authenticated !== true || diagnostic.ok !== true) {
            throw new Error(Geotab diagnostic failed at stage: ${diagnostic.stage || 'unknown'}`);
          }
          const lock = JSON.parse(fs.readFileSync('/tmp/inventory-lock.json', 'utf8'));
          if (!String(lock.error || '').includes('temporarily locked')) throw new Error('Inventory lock response is invalid');
          console.log('Dashboard and Geotab checks passed; inventory remains protected.');
          NODE
