name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "lib/**"
      - "build/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norlow-cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized. Add CLOUDFLARE_API_TOKEN and rerun."
          fi

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Verify live dashboard, Geotab, and inventory
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/" -o /tmp/dashboard.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/inventory" -o /tmp/inventory.html
          repair_status="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors -o /tmp/repairs-api.json -w '%{http_code}' "$site_url/api/repairs?sync=1")"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/api/inventory" -o /tmp/inventory-api.json
          if [ "$repair_status" != "200" ]; then
            echo "Repair API returned HTTP $repair_status."
            cat /tmp/repairs-api.json || true
            account_args=()
            if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
            echo "Configured Worker secret names:"
            npx wrangler secret list --name norlow-repair-dashboard "${account_args[@]}" || true
            echo "Sanitized Geotab synchronization state:"
            npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc \
              --command "SELECT feed_name, last_success_at, last_error FROM sync_state WHERE feed_name LIKE 'geotab%';" \
              "${account_args[@]}" || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const repairs = JSON.parse(fs.readFileSync('/tmp/repairs-api.json', 'utf8'));
          for (const key of ['repairs', 'dvir', 'pm', 'equipment']) {
            if (!Array.isArray(repairs[key])) throw new Error(`Missing dashboard array: ${key}`);
          }
          if (repairs.geotabConfigured !== true) throw new Error('Encrypted Geotab configuration is not active');
          const inventory = JSON.parse(fs.readFileSync('/tmp/inventory-api.json', 'utf8'));
          if (!Array.isArray(inventory.parts) || !Array.isArray(inventory.vendors)) throw new Error('Invalid inventory payload');
          console.log('Repair, direct Geotab, and inventory APIs returned valid payloads.');
          NODE
