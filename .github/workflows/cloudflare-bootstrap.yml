name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "lib/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  # Manual dispatch is useful after a workflow-authored commit because GitHub does not
  # trigger downstream workflows from pushes made with the default GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: norlow-cloudflare-bootstrap-v5
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_BOOTSTRAP_TOKEN: ${{ secrets.AUTH_BOOTSTRAP_TOKEN }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized. Add CLOUDFLARE_API_TOKEN and rerun."
          fi

      - name: Mark production deployment pending
        if: steps.auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >/tmp/production-status.json
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: 'production/cloudflare',
            description: 'Cloudflare deployment and D1 migration verification running',
            target_url: process.env.TARGET_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/production-status.json >/dev/null

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Install dashboard bootstrap secret
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUTH_BOOTSTRAP_TOKEN:-}" ]; then
            echo "AUTH_BOOTSTRAP_TOKEN is not set as a GitHub Actions secret. Existing Cloudflare secret, if any, is unchanged."
            exit 0
          fi
          node - <<'NODE' | npx wrangler secret bulk --config wrangler.jsonc --name norlow-repair-dashboard
          process.stdout.write(JSON.stringify({ AUTH_BOOTSTRAP_TOKEN: process.env.AUTH_BOOTSTRAP_TOKEN }));
          NODE
          echo "Dashboard bootstrap secret installed."

      - name: Verify authentication and deployment health
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.norlo-repair-system.workers.dev"

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/login" -o /tmp/login.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/setup" -o /tmp/setup.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/api/auth/setup" -o /tmp/auth-setup.json

          node - <<'NODE'
          const fs = require('fs');
          const login = fs.readFileSync('/tmp/login.html', 'utf8');
          const setup = fs.readFileSync('/tmp/setup.html', 'utf8');
          const status = JSON.parse(fs.readFileSync('/tmp/auth-setup.json', 'utf8'));
          if (!login.includes('Sign in')) throw new Error('Login page smoke check failed.');
          if (!setup.includes('Create the first administrator') && !setup.includes('ONE-TIME SECURITY SETUP')) {
            throw new Error('Setup page smoke check failed.');
          }
          if (typeof status.setupRequired !== 'boolean' || typeof status.bootstrapConfigured !== 'boolean') {
            throw new Error('Authentication setup status response is invalid.');
          }
          const deployment = status.deployment;
          if (!deployment || deployment.release !== '2026-08-18-work-order-review-0062') {
            throw new Error(`Expected release 2026-08-18-work-order-review-0062, received ${JSON.stringify(deployment)}`);
          }
          if (deployment.ok !== true) {
            throw new Error(`Production D1 migrations are incomplete: ${JSON.stringify(deployment.migrations || deployment)}`);
          }
          console.log(`Deployment verified. release=${deployment.release}, migrations=${JSON.stringify(deployment.migrations)}`);
          console.log(`Authentication setup endpoint ready. setupRequired=${status.setupRequired}, bootstrapConfigured=${status.bootstrapConfigured}`);
          NODE

          root_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$site_url/")"
          if [ "$root_status" != "302" ]; then
            echo "Expected unauthenticated dashboard request to redirect, got HTTP $root_status."
            exit 1
          fi

          for endpoint in /api/repairs /api/work-orders /api/inventory '/api/repairs?checkGeotab=1'; do
            status="$(curl --silent --show-error -o /tmp/protected.json -w '%{http_code}' "$site_url$endpoint")"
            if [ "$status" != "401" ] && [ "$status" != "503" ]; then
              echo "Protected endpoint $endpoint returned unexpected HTTP $status."
              cat /tmp/protected.json
              exit 1
            fi
          done
          echo "Repair, work-order, inventory, and Geotab diagnostic APIs are not publicly readable."

      - name: Publish production deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_READY: ${{ steps.auth.outputs.ready }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          state="failure"
          description="Cloudflare deployment or D1 schema verification failed"
          if [ "$AUTH_READY" = "true" ] && [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Verified release 0062 and production D1 schema"
          elif [ "$AUTH_READY" != "true" ]; then
            description="Cloudflare deployment authorization is missing"
          fi
          STATUS_STATE="$state" STATUS_DESCRIPTION="$description" node - <<'NODE' >/tmp/production-status-final.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATUS_STATE,
            context: 'production/cloudflare',
            description: process.env.STATUS_DESCRIPTION,
            target_url: process.env.TARGET_URL,
          }));
          NODE
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/production-status-final.json >/dev/null

