name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "build/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norlow-cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
      SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized yet. Add the CLOUDFLARE_API_TOKEN repository secret, then rerun this workflow."
          fi

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Sync Google Sheet connector secrets
        if: steps.auth.outputs.ready == 'true'
        id: connector
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHEET_API_URL:-}" ] || [ -z "${SHEET_API_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SHEET_API_URL and SHEET_API_TOKEN are not both configured in GitHub Actions. The site will remain in preview mode."
            exit 0
          fi

          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID")
          fi

          printf '%s' "$SHEET_API_URL" | npx wrangler secret put SHEET_API_URL --name norlow-repair-dashboard "${account_args[@]}"
          printf '%s' "$SHEET_API_TOKEN" | npx wrangler secret put SHEET_API_TOKEN --name norlow-repair-dashboard "${account_args[@]}"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Google Sheet connector secrets synchronized."

      - name: Verify live dashboard
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.jtomaski.workers.dev"

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "$site_url/" -o /tmp/dashboard.html
          echo "Dashboard homepage returned successfully."

          api_status="$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            --output /tmp/repairs-api.json --write-out '%{http_code}' "$site_url/api/repairs")"
          echo "Repair API HTTP status: $api_status"

          if [ "$api_status" = "200" ]; then
            node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/repairs-api.json', 'utf8'));
          for (const key of ['repairs', 'dvir', 'pm', 'equipment']) {
            if (!Array.isArray(payload[key])) throw new Error(`Missing dashboard array: ${key}`);
          }
          console.log('Repair API returned the expected live dashboard payload.');
          NODE
          elif [ "$api_status" = "503" ]; then
            echo "Dashboard deployment is healthy, but the Google Sheet connector is not configured."
          else
            echo "Unexpected repair API response."
            exit 1
          fi
