name: Bootstrap Cloudflare

on:
  push:
    branches:
      - main
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/cloudflare-bootstrap.yml"
      - "app/**"
      - "lib/**"
      - "build/**"
      - "migrations/**"
      - "public/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "wrangler.template.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: norlow-cloudflare-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
      GEOTAB_USERNAME: ${{ secrets.GEOTAB_USERNAME }}
      GEOTAB_PASSWORD: ${{ secrets.GEOTAB_PASSWORD }}

    steps:
      - name: Check authorization
        id: auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare is not authorized. Add CLOUDFLARE_API_TOKEN and rerun."
          fi

      - name: Check out project
        if: steps.auth.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.auth.outputs.ready == 'true'
        run: npm ci

      - name: Create resources, migrate, and deploy
        if: steps.auth.outputs.ready == 'true'
        run: bash scripts/cloudflare-bootstrap.sh

      - name: Sync Geotab secrets
        if: steps.auth.outputs.ready == 'true'
        id: geotab
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEOTAB_DATABASE:-}" ] || [ -z "${GEOTAB_USERNAME:-}" ] || [ -z "${GEOTAB_PASSWORD:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Geotab secrets are not configured. D1 repairs and inventory remain available; live DVIR sync is disabled."
            exit 0
          fi
          account_args=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then account_args=(--account-id "$CLOUDFLARE_ACCOUNT_ID"); fi
          printf '%s' "$GEOTAB_DATABASE" | npx wrangler secret put GEOTAB_DATABASE --name norlow-repair-dashboard "${account_args[@]}"
          printf '%s' "$GEOTAB_USERNAME" | npx wrangler secret put GEOTAB_USERNAME --name norlow-repair-dashboard "${account_args[@]}"
          printf '%s' "$GEOTAB_PASSWORD" | npx wrangler secret put GEOTAB_PASSWORD --name norlow-repair-dashboard "${account_args[@]}"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Geotab secrets synchronized."

      - name: Verify live dashboard and inventory
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          site_url="https://norlow-repair-dashboard.jtomaski.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/" -o /tmp/dashboard.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/inventory" -o /tmp/inventory.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/api/repairs" -o /tmp/repairs-api.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$site_url/api/inventory" -o /tmp/inventory-api.json
          node - <<'NODE'
          const fs = require('fs');
          const repairs = JSON.parse(fs.readFileSync('/tmp/repairs-api.json', 'utf8'));
          for (const key of ['repairs', 'dvir', 'pm', 'equipment']) {
            if (!Array.isArray(repairs[key])) throw new Error(`Missing dashboard array: ${key}`);
          }
          const inventory = JSON.parse(fs.readFileSync('/tmp/inventory-api.json', 'utf8'));
          if (!Array.isArray(inventory.parts) || !Array.isArray(inventory.vendors)) throw new Error('Invalid inventory payload');
          console.log('Repair, Geotab-ready, and inventory APIs returned valid payloads.');
          NODE
