name: Import Trailer Maintenance Dates

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - data/trailer-maintenance-import-20260810/READY

permissions:
  contents: read
  actions: read

jobs:
  import-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HISTORY_WRAP_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_PAYLOAD_SHA256: 71c3872bebf29241cc9dd7f2831851bfc7dd1de8cd598b9d98838ab6bc477a50
      EXPECTED_ROWS: "597"
    steps:
      - name: Check authorization
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Check out encrypted payload
        uses: actions/checkout@v6

      - name: Download one-time encrypted private key
        uses: actions/download-artifact@v4
        with:
          name: norlow-history-import-key-31392647385
          path: /tmp/trailer-import-key
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31392647385

      - name: Decrypt and validate payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/trailer-import
          tr -d '\r\n' < data/trailer-maintenance-import-20260810/payload.b64 | base64 -d > /tmp/trailer-import/payload.enc
          tr -d '\r\n' < data/trailer-maintenance-import-20260810/pass.b64 | base64 -d > /tmp/trailer-import/pass.enc

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/trailer-import-key/history-private.pem.enc \
            -out /tmp/trailer-import/private.pem \
            -pass env:HISTORY_WRAP_KEY
          openssl pkeyutl -decrypt \
            -inkey /tmp/trailer-import/private.pem \
            -in /tmp/trailer-import/pass.enc \
            -out /tmp/trailer-import/pass.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/trailer-import/payload.enc \
            -out /tmp/trailer-import/payload.json.gz \
            -pass file:/tmp/trailer-import/pass.txt
          gzip -dc /tmp/trailer-import/payload.json.gz > /tmp/trailer-import/payload.json

          actual_sha="$(sha256sum /tmp/trailer-import/payload.json | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_PAYLOAD_SHA256"
          rm -f /tmp/trailer-import/private.pem /tmp/trailer-import/pass.txt
          echo "Encrypted payload decrypted and checksum verified."

      - name: Apply trailer service and annual baselines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function normalizeToken(raw) {
            return String(raw || '')
              .trim()
              .replace(/^CLOUDFLARE_API_TOKEN=/, '')
              .replace(/^Bearer\s*/i, '')
              .replace(/^"|"$/g, '');
          }

          const token = normalizeToken(process.env.CLOUDFLARE_API_TOKEN);
          if (!token) throw new Error('Cloudflare token is missing.');
          const expectedRows = Number(process.env.EXPECTED_ROWS);
          const payload = JSON.parse(fs.readFileSync('/tmp/trailer-import/payload.json', 'utf8'));
          const rows = Array.isArray(payload.rows) ? payload.rows : [];
          if (rows.length !== expectedRows) throw new Error(`Expected ${expectedRows} rows, found ${rows.length}.`);

          const unitPattern = /^(?:TRL\d{3}|\d{5}|PUP3)$/;
          const datePattern = /^\d{4}-\d{2}-\d{2}$/;
          const seen = new Set();
          for (const row of rows) {
            if (!row || typeof row !== 'object') throw new Error('Import row is invalid.');
            const unit = String(row.unit || '').trim().toUpperCase();
            const serviceDate = String(row.serviceDate || '').trim();
            const annualDate = String(row.annualDate || '').trim();
            if (!unitPattern.test(unit)) throw new Error('Import contains an unexpected unit format.');
            if (!datePattern.test(serviceDate) || !datePattern.test(annualDate)) throw new Error('Import contains an invalid date format.');
            if (seen.has(unit)) throw new Error('Import contains a duplicate unit.');
            seen.add(unit);
            row.unit = unit;
            row.serviceDate = serviceDate;
            row.annualDate = annualDate;
          }

          async function api(path, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...options,
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.json();
            if (!response.ok || body.success === false) {
              const detail = Array.isArray(body.errors) ? body.errors.map((e) => e.message || e.code).join('; ') : response.statusText;
              throw new Error(`Cloudflare API request failed: ${detail}`);
            }
            return body.result;
          }

          async function findDatabase() {
            const accounts = await api('/accounts?per_page=50');
            for (const account of accounts || []) {
              const dbs = await api(`/accounts/${encodeURIComponent(account.id)}/d1/database?per_page=100`);
              const db = (dbs || []).find((candidate) => candidate.name === 'norlow-repair-production');
              if (db) return { accountId: account.id, databaseId: db.uuid || db.id };
            }
            throw new Error('Production D1 database could not be resolved.');
          }

          function chunks(values, size) {
            const output = [];
            for (let index = 0; index < values.length; index += size) output.push(values.slice(index, index + size));
            return output;
          }

          function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }

          function knownTrailer(equipment) {
            return String(equipment.equipment_type || '').toLowerCase() === 'trailer' ||
              String(equipment.geotab_asset_class || '').toLowerCase() === 'trailer' ||
              String(equipment.category || '').toLowerCase() === 'trailers' ||
              Boolean(String(equipment.geotab_trailer_id || '').trim());
          }

          function sourceClass(unit) {
            if (/^TRL\d{3}$/.test(unit)) return 'trl';
            if (/^\d{5}$/.test(unit)) return 'five';
            return 'other';
          }

          (async () => {
            const { accountId, databaseId } = await findDatabase();
            const queryUrl = `/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;

            async function query(statement) {
              return api(queryUrl, { method: 'POST', body: JSON.stringify(statement) });
            }

            const candidatesBySource = new Map(rows.map((row) => [row.unit, []]));
            for (const sourceGroup of chunks(rows, 20)) {
              const where = sourceGroup.map(() => 'UPPER(TRIM(unit)) LIKE ?').join(' OR ');
              const result = await query({
                sql: `SELECT id, UPPER(TRIM(unit)) AS unit, equipment_type, category, geotab_asset_class, geotab_trailer_id, geotab_device_id FROM equipment WHERE active = 1 AND (${where})`,
                params: sourceGroup.map((row) => `${row.unit}%`),
              });
              const equipmentRows = result?.[0]?.results || result?.results || [];
              for (const row of sourceGroup) {
                const prefix = new RegExp(`^${escapeRegExp(row.unit)}(?:$|[^0-9A-Z])`);
                candidatesBySource.set(row.unit, equipmentRows.filter((equipment) => prefix.test(String(equipment.unit || '').trim().toUpperCase())));
              }
            }

            const updates = [];
            let matchedSources = 0;
            let exactSources = 0;
            let annotatedSources = 0;
            let duplicateTrailerSources = 0;
            let missing = 0;
            let ambiguous = 0;
            const missingByClass = { trl: 0, five: 0, other: 0 };
            const ambiguousByClass = { trl: 0, five: 0, other: 0 };

            for (const row of rows) {
              const candidates = candidatesBySource.get(row.unit) || [];
              const exact = candidates.filter((equipment) => String(equipment.unit || '').trim().toUpperCase() === row.unit);
              const preferredPool = exact.length ? exact : candidates;
              const trailerPool = preferredPool.filter(knownTrailer);
              let chosen = [];
              let kind = '';

              if (preferredPool.length === 1) {
                chosen = preferredPool;
                kind = exact.length ? 'exact' : 'annotated';
              } else if (trailerPool.length >= 1) {
                chosen = trailerPool;
                kind = 'duplicate-trailer';
              }

              if (!chosen.length) {
                const cls = sourceClass(row.unit);
                if (!candidates.length) {
                  missing += 1;
                  missingByClass[cls] += 1;
                } else {
                  ambiguous += 1;
                  ambiguousByClass[cls] += 1;
                }
                continue;
              }

              matchedSources += 1;
              if (kind === 'exact') exactSources += 1;
              else if (kind === 'annotated') annotatedSources += 1;
              else duplicateTrailerSources += 1;
              for (const equipment of chosen) {
                updates.push({ ...row, equipmentId: Number(equipment.id) });
              }
            }

            const updateById = new Map();
            for (const row of updates) {
              const existing = updateById.get(row.equipmentId);
              if (existing && (existing.serviceDate !== row.serviceDate || existing.annualDate !== row.annualDate)) {
                throw new Error('Two source rows resolved to one equipment record with conflicting dates.');
              }
              updateById.set(row.equipmentId, row);
            }
            const uniqueUpdates = [...updateById.values()];

            for (const group of chunks(uniqueUpdates, 15)) {
              const serviceCases = group.map(() => 'WHEN ? THEN ?').join(' ');
              const annualCases = group.map(() => 'WHEN ? THEN ?').join(' ');
              const idPlaceholders = group.map(() => '?').join(',');
              const equipmentParams = [
                ...group.flatMap((row) => [row.equipmentId, row.serviceDate]),
                ...group.flatMap((row) => [row.equipmentId, row.annualDate]),
                ...group.map((row) => row.equipmentId),
              ];
              await query({
                sql: `UPDATE equipment SET service_date = CASE id ${serviceCases} ELSE service_date END, annual_date = CASE id ${annualCases} ELSE annual_date END, updated_at = CURRENT_TIMESTAMP WHERE id IN (${idPlaceholders}) AND active = 1`,
                params: equipmentParams,
              });

              const pmValues = group.map(() => "(?, 'Service', 'Current', ?, ?, CURRENT_TIMESTAMP)").join(',');
              await query({
                sql: `INSERT INTO pm_status (equipment_id, pm_type, status, service_date, annual_date, updated_at) VALUES ${pmValues} ON CONFLICT(equipment_id) DO UPDATE SET pm_type = COALESCE(pm_status.pm_type, excluded.pm_type), status = COALESCE(pm_status.status, 'Current'), service_date = excluded.service_date, annual_date = excluded.annual_date, updated_at = CURRENT_TIMESTAMP`,
                params: group.flatMap((row) => [row.equipmentId, row.serviceDate, row.annualDate]),
              });
            }

            let verified = 0;
            for (const group of chunks(uniqueUpdates, 60)) {
              const placeholders = group.map(() => '?').join(',');
              const result = await query({
                sql: `SELECT e.id, e.service_date, e.annual_date, p.service_date AS pm_service_date, p.annual_date AS pm_annual_date FROM equipment e JOIN pm_status p ON p.equipment_id = e.id WHERE e.id IN (${placeholders})`,
                params: group.map((row) => row.equipmentId),
              });
              const records = result?.[0]?.results || result?.results || [];
              const byId = new Map(records.map((record) => [Number(record.id), record]));
              for (const row of group) {
                const record = byId.get(row.equipmentId);
                if (!record || record.service_date !== row.serviceDate || record.annual_date !== row.annualDate || record.pm_service_date !== row.serviceDate || record.pm_annual_date !== row.annualDate) {
                  throw new Error('Post-import verification failed for one or more rows.');
                }
                verified += 1;
              }
            }

            console.log(`Trailer maintenance date import complete: input=${rows.length}, matchedSources=${matchedSources}, exactSources=${exactSources}, annotatedSources=${annotatedSources}, duplicateTrailerSources=${duplicateTrailerSources}, recordsUpdated=${uniqueUpdates.length}, verified=${verified}, missing=${missing} (trl=${missingByClass.trl}, five=${missingByClass.five}, other=${missingByClass.other}), ambiguous=${ambiguous} (trl=${ambiguousByClass.trl}, five=${ambiguousByClass.five}, other=${ambiguousByClass.other}).`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Remove decrypted material
        if: always()
        run: rm -rf /tmp/trailer-import /tmp/trailer-import-key
