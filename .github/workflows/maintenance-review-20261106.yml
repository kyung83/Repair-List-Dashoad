name: Maintenance exception review 2026-11-06
on:
  push:
    branches: [ops/maintenance-review-20261106]
    paths:
      - '.github/workflows/maintenance-review-20261106.yml'
      - 'scripts/maintenance-review-20261106.mjs'
permissions:
  contents: read
concurrency:
  group: norlow-maintenance-review-20261106
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'kyung83/Repair-List-Dashoad' && github.actor == 'kyung83'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check script
        run: node --check scripts/maintenance-review-20261106.mjs
      - name: Review authorized maintenance records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/maintenance-review-20261106.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-review-${{ github.run_id }}
          path: encrypted-report.json
          if-no-files-found: error
          retention-days: 1
