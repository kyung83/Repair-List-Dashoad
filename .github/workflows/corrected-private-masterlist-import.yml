name: Corrected Private Master Truck List Import

on:
  push:
    branches:
      - ops/corrected-masterlist-import

permissions:
  contents: read

jobs:
  masterlist_import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run corrected private masterlist import
        run: bash scripts/corrected-masterlist-import.sh
