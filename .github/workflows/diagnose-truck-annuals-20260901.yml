name: Diagnose truck annual matches

on:
  push:
    branches:
      - agent/diagnose-truck-annuals-20260901

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build read-only match diagnostic
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = fs.readFileSync('migrations/0127_update_truck_annuals_20260901.sql', 'utf8');
          const start = file.indexOf('INSERT INTO _truck_annual_snapshot_20260901');
          const end = file.indexOf('DROP TABLE IF EXISTS _truck_annual_matches_20260901');
          if (start < 0 || end <= start) throw new Error('Could not locate truck annual source block.');
          const block = file.slice(start, end);
          const units = [];
          const row = /\('([^']+)',\s*(NULL|'(\d{4}-\d{2}-\d{2})')\)/g;
          for (const match of block.matchAll(row)) {
            if (match[2] !== 'NULL') units.push(match[1]);
          }
          if (units.length !== 277) throw new Error(`Expected 277 dated units, found ${units.length}.`);
          const quote = (value) => `'${value.replaceAll("'", "''")}'`;
          const values = units.map((unit) => `(${quote(unit)})`).join(',\n');
          const matchExpr = `(
            (upper(s.unit) = 'FORD TRANSIT' AND upper(trim(e.unit)) IN ('FORD TRANSIT', 'FORD TRANSIT VAN'))
            OR
            (upper(s.unit) <> 'FORD TRANSIT' AND (
              upper(trim(e.unit)) = upper(s.unit)
              OR upper(trim(e.unit)) LIKE upper(s.unit) || '(%'
              OR upper(trim(e.unit)) LIKE upper(s.unit) || ' (%'
              OR upper(trim(e.unit)) LIKE upper(s.unit) || '/%'
              OR upper(trim(e.unit)) = 'TRUCK ' || upper(s.unit)
              OR upper(trim(e.unit)) LIKE 'TRUCK ' || upper(s.unit) || '(%'
              OR upper(trim(e.unit)) LIKE 'TRUCK ' || upper(s.unit) || ' (%'
            ))
          )`;
          const sql = `
          WITH source(unit) AS (VALUES
          ${values}
          ), strict_counts AS (
            SELECT s.unit, COUNT(e.id) AS strict_matches
            FROM source s
            LEFT JOIN equipment e
              ON e.active = 1
             AND e.archived_at IS NULL
             AND lower(COALESCE(e.equipment_type, '')) <> 'trailer'
             AND e.geotab_trailer_id IS NULL
             AND ${matchExpr}
            GROUP BY s.unit
          ), problem AS (
            SELECT unit, strict_matches FROM strict_counts WHERE strict_matches <> 1
          )
          SELECT p.unit AS source_unit,
                 p.strict_matches,
                 e.id AS candidate_id,
                 e.unit AS candidate_unit,
                 e.equipment_type,
                 e.active,
                 e.archived_at,
                 e.geotab_device_id,
                 e.geotab_trailer_id
          FROM problem p
          LEFT JOIN equipment e
            ON (
              (upper(p.unit) = 'FORD TRANSIT' AND upper(trim(e.unit)) LIKE '%FORD%TRANSIT%')
              OR
              (upper(p.unit) <> 'FORD TRANSIT' AND (
                upper(trim(e.unit)) = upper(p.unit)
                OR upper(trim(e.unit)) LIKE upper(p.unit) || '(%'
                OR upper(trim(e.unit)) LIKE upper(p.unit) || ' (%'
                OR upper(trim(e.unit)) LIKE upper(p.unit) || '/%'
                OR upper(trim(e.unit)) LIKE 'TRUCK ' || upper(p.unit) || '%'
              ))
            )
          ORDER BY p.unit, e.id;
          `;
          fs.writeFileSync('/tmp/diagnose-truck-annuals.sql', sql);
          NODE
      - name: Query production D1 without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute norlow-repair-production --remote --file /tmp/diagnose-truck-annuals.sql
