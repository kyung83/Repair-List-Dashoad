name: Validate Parts Inventory v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare production-shaped Wrangler config
        run: |
          sed 's/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/00000000-0000-0000-0000-000000000000/g' wrangler.template.jsonc > wrangler.jsonc
          cp scripts/manual-trailer-date-fix-20260813.sql migrations/0056_apply_manual_trailer_dates.sql
      - name: Verified application build
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.jsonc
        run: npm run build
      - name: Inventory v2 source assertions
        run: |
          grep -q "inventory_operation_commits" migrations/0092_parts_inventory_v2_operations.sql
          grep -q "derived_repair_part_reservations" migrations/0092_parts_inventory_v2_operations.sql
          grep -q "applyPartToRepair" lib/part-stock-operations.ts
          grep -q "INSERT OR IGNORE INTO part_core_obligations" lib/part-stock-operations.ts
          grep -q "undoInventoryOperation" lib/part-stock-operations.ts
          grep -q "getDerivedPartAvailability" lib/derived-reservations.ts
          ! grep -qi "CREATE[[:space:]]\+TRIGGER" migrations/0094_inventory_v2_operational_controls.sql
