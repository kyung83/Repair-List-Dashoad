name: One-time repair board parts fix

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/repair-board-parts-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/cloudflare-standalone
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repair board inventory patch
        run: python3 scripts/repair-board-parts-fix.py
      - name: Lint changed repair board
        run: npx eslint app/page.tsx --rule 'react-hooks/set-state-in-effect: off'
      - name: Build and test
        run: npm test
      - name: Commit tested fix and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kyung83"
          git config user.email "161100189+kyung83@users.noreply.github.com"
          git rm .github/workflows/repair-board-parts-fix.yml scripts/repair-board-parts-fix.py
          git add app/page.tsx
          git diff --cached --check
          git commit -m "Attach inventory parts from repair board"
          git push origin HEAD:agent/cloudflare-standalone
