name: Private Equipment Identity Diagnostic

on:
  push:
    branches:
      - ops/private-equipment-identity-diagnostic

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Query and encrypt live equipment identity
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#CLOUDFLARE_API_TOKEN=}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN

          ACCOUNT_ARG=()
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            ACCOUNT_ARG=(--account-id "$CLOUDFLARE_ACCOUNT_ID")
          fi

          list_output="$(npx wrangler d1 list --json "${ACCOUNT_ARG[@]}")"
          DB_ID="$(node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync(0,"utf8")); const row=data.find(x=>x.name==="norlow-repair-production"); if(row) process.stdout.write(row.uuid||row.id||row.database_id||"");' <<<"$list_output")"
          if [ -z "$DB_ID" ]; then
            echo "Could not determine production D1 database ID."
            exit 1
          fi

          sed "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$DB_ID/g" wrangler.template.jsonc > wrangler.jsonc

          aggregate_sql="SELECT lower(trim(COALESCE(equipment_type,''))) AS equipment_type, active, CASE WHEN merged_into_equipment_id IS NULL THEN 0 ELSE 1 END AS merged, COUNT(*) AS equipment_count FROM equipment GROUP BY 1,2,3 ORDER BY 1,2,3;"
          echo "LIVE_EQUIPMENT_TYPE_COUNTS_BEGIN"
          npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc "${ACCOUNT_ARG[@]}" --json --command "$aggregate_sql"
          echo "LIVE_EQUIPMENT_TYPE_COUNTS_END"

          filter_sql="SELECT COUNT(*) AS all_active_unmerged, SUM(CASE WHEN lower(trim(COALESCE(equipment_type,''))) IN ('truck','vehicle','glider','switcher') THEN 1 ELSE 0 END) AS original_import_filter, SUM(CASE WHEN lower(trim(COALESCE(equipment_type,'')))='other' THEN 1 ELSE 0 END) AS other_type, SUM(CASE WHEN lower(trim(COALESCE(equipment_type,'')))='trailer' THEN 1 ELSE 0 END) AS trailer_type FROM equipment WHERE active=1 AND merged_into_equipment_id IS NULL;"
          echo "LIVE_EQUIPMENT_FILTER_SUMMARY_BEGIN"
          npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc "${ACCOUNT_ARG[@]}" --json --command "$filter_sql"
          echo "LIVE_EQUIPMENT_FILTER_SUMMARY_END"

          sql="SELECT id,unit,COALESCE(equipment_type,'') AS equipment_type,active,merged_into_equipment_id,COALESCE(archived_at,'') AS archived_at FROM equipment ORDER BY id;"
          npx wrangler d1 execute norlow-repair-production --remote --config wrangler.jsonc "${ACCOUNT_ARG[@]}" --json --command "$sql" > /tmp/equipment.json

          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/equipment.json','utf8'));
          const rows=[];
          function walk(v){
            if(Array.isArray(v)){for(const x of v)walk(x);return;}
            if(!v||typeof v!=='object')return;
            if(Object.prototype.hasOwnProperty.call(v,'unit')&&Object.prototype.hasOwnProperty.call(v,'equipment_type')) rows.push(v);
            for(const x of Object.values(v))walk(x);
          }
          walk(raw);
          const trucks=rows.filter(r=>Number(r.active)===1&&!r.merged_into_equipment_id&&['truck','vehicle','glider','switcher'].includes(String(r.equipment_type||'').trim().toLowerCase()));
          const shape=s=>String(s??'').trim().replace(/[0-9]/g,'#').replace(/[A-Za-z]/g,'A');
          const shapes=new Map(), digitLengths=new Map(), digitKeys=new Map();
          let pureNumeric=0, hasLetters=0, hasHyphen=0, blank=0;
          for(const r of trucks){
            const u=String(r.unit??'').trim();
            if(!u){blank++;continue;}
            const sh=shape(u);shapes.set(sh,(shapes.get(sh)||0)+1);
            if(/^[0-9]+$/.test(u))pureNumeric++;
            if(/[A-Za-z]/.test(u))hasLetters++;
            if(u.includes('-'))hasHyphen++;
            const digits=u.replace(/\D/g,'');
            digitLengths.set(digits.length,(digitLengths.get(digits.length)||0)+1);
            if(digits)digitKeys.set(digits,(digitKeys.get(digits)||0)+1);
          }
          const topShapes=[...shapes.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25).map(([shape,count])=>({shape,count}));
          const lengthCounts=[...digitLengths.entries()].sort((a,b)=>a[0]-b[0]).map(([digits,count])=>({digits,count}));
          const duplicateDigitKeys=[...digitKeys.values()].filter(n=>n>1).length;
          console.log('LIVE_TRUCK_UNIT_SHAPES='+JSON.stringify({count:trucks.length,pureNumeric,hasLetters,hasHyphen,blank,duplicateDigitKeys,digitLengths:lengthCounts,topShapes}));
          NODE

          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const zlib=require('zlib');

          const publicKeyB64='';
          const publicKey=crypto.createPublicKey({key:Buffer.from(publicKeyB64,'base64'),format:'der',type:'spki'});
          const source=fs.readFileSync('/tmp/equipment.json');
          const compressed=zlib.gzipSync(source);
          const aesKey=crypto.randomBytes(32);
          const iv=crypto.randomBytes(12);
          const aad=Buffer.from('northern-equipment-diagnostic-v1','utf8');
          const cipher=crypto.createCipheriv('aes-256-gcm',aesKey,iv);
          cipher.setAAD(aad);
          const ciphertext=Buffer.concat([cipher.update(compressed),cipher.final()]);
          const tag=cipher.getAuthTag();
          const wrappedKey=crypto.publicEncrypt({
            key:publicKey,
            oaepHash:'sha256',
            padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,
          },aesKey);

          const pkg={
            alg:'RSA-OAEP-2048-SHA256+AES-256-GCM+gzip',
            wrappedKey:wrappedKey.toString('base64'),
            iv:iv.toString('base64'),
            aad:aad.toString('utf8'),
            ciphertext:ciphertext.toString('base64'),
            tag:tag.toString('base64'),
          };
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/private-equipment-diagnostic.enc.json',JSON.stringify(pkg));
          console.log('Encrypted equipment diagnostic prepared.');
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/private-equipment-diagnostic.enc.json
          git commit -m "Store encrypted equipment identity diagnostic" || true
          git push origin HEAD:ops/private-equipment-identity-diagnostic
