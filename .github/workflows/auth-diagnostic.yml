name: One-time authentication diagnostic

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/auth-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: https://norlow-repair-dashboard.norlo-repair-system.workers.dev

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe top-level Worker crypto
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SITE_URL/_auth-crypto-probe" | tee /tmp/crypto-probe.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/crypto-probe.json', 'utf8'));
          if (result.buildMarker !== 'worker-crypto-probe-v1') {
            throw new Error(`Unexpected live Worker build marker: ${result.buildMarker || '<missing>'}`);
          }
          console.log(`TOP_LEVEL_PBKDF2_SUPPORTED=${result.pbkdf2Supported}`);
          console.log(`TOP_LEVEL_PBKDF2_ERROR=${result.errorName || '<none>'}`);
          NODE

      - name: Verify live authentication
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#CLOUDFLARE_API_TOKEN=}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN

          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const email = `auth-smoke-${crypto.randomUUID()}@norlow.invalid`;
          const password = crypto.randomBytes(24).toString('base64url');
          const salt = crypto.randomBytes(16);
          const iterations = 210000;
          const hash = crypto.pbkdf2Sync(password, salt, iterations, 32, 'sha256').toString('base64url');
          const quote = (value) => `'${String(value).replaceAll("'", "''")}'`;
          fs.writeFileSync('/tmp/norlow-auth-smoke.json', JSON.stringify({ email, password }));
          fs.writeFileSync('/tmp/norlow-auth-smoke-insert.sql', `
          INSERT INTO app_users (email, display_name, role, password_hash, password_salt, password_iterations, active, force_password_change, updated_at)
          VALUES (${quote(email)}, 'Authentication Smoke Test', 'admin', ${quote(hash)}, ${quote(salt.toString('base64url'))}, ${iterations}, 1, 0, CURRENT_TIMESTAMP);
          `);
          fs.writeFileSync('/tmp/norlow-auth-smoke-delete.sql', `DELETE FROM app_users WHERE email = ${quote(email)} COLLATE NOCASE;`);
          NODE

          SMOKE_EMAIL="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/norlow-auth-smoke.json','utf8')).email)")"
          SMOKE_PASSWORD="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/norlow-auth-smoke.json','utf8')).password)")"
          export SMOKE_EMAIL SMOKE_PASSWORD

          cleanup() {
            npx wrangler d1 execute norlow-repair-production --remote --yes --file=/tmp/norlow-auth-smoke-delete.sql >/dev/null 2>&1 || true
            rm -f /tmp/norlow-auth-smoke* /tmp/login.json /tmp/cookies.txt
          }
          trap cleanup EXIT

          npx wrangler d1 execute norlow-repair-production --remote --yes --file=/tmp/norlow-auth-smoke-insert.sql >/dev/null
          sleep 15

          node - <<'NODE' >/tmp/payload.json
          process.stdout.write(JSON.stringify({ email: process.env.SMOKE_EMAIL, password: process.env.SMOKE_PASSWORD }));
          NODE

          status="$(curl --silent --show-error -o /tmp/login.json -c /tmp/cookies.txt -w '%{http_code}' \
            -H 'content-type: application/json' --data-binary @/tmp/payload.json "$SITE_URL/api/auth/login")"
          echo "LOGIN_STATUS=$status"
          cat /tmp/login.json

          if [ "$status" = "200" ]; then
            me_status="$(curl --silent --show-error -o /tmp/me.json -b /tmp/cookies.txt -w '%{http_code}' "$SITE_URL/api/auth/me")"
            echo "SESSION_STATUS=$me_status"
            cat /tmp/me.json
          fi

          test "$status" = "200"
