name: One-time inventory import key read

on:
  push:
    branches:
      - agent/cloudflare-standalone
    paths:
      - ".github/workflows/inventory-key-read.yml"

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: https://norlow-repair-dashboard.norlo-repair-system.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read import public key
        shell: bash
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "${CLOUDFLARE_API_TOKEN:-}" | tr -d '[:space:]')"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#CLOUDFLARE_API_TOKEN=}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#Bearer}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN#\"}"
          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN%\"}"
          export CLOUDFLARE_API_TOKEN

          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const email = `inventory-key-${crypto.randomUUID()}@norlow.invalid`;
          const password = crypto.randomBytes(24).toString('base64url');
          const salt = crypto.randomBytes(16);
          const hash = crypto.scryptSync(password, salt, 32, { N: 16384, r: 8, p: 1, maxmem: 64 * 1024 * 1024 }).toString('base64url');
          const quote = (value) => `'${String(value).replaceAll("'", "''")}'`;
          fs.writeFileSync('/tmp/inventory-key-user.json', JSON.stringify({ email, password }));
          fs.writeFileSync('/tmp/inventory-key-insert.sql', `INSERT INTO app_users (email, display_name, role, password_hash, password_salt, password_iterations, password_algorithm, active, force_password_change, updated_at) VALUES (${quote(email)}, 'One-time Inventory Key Reader', 'admin', ${quote(hash)}, ${quote(salt.toString('base64url'))}, 0, 'scrypt-v1', 1, 0, CURRENT_TIMESTAMP);`);
          fs.writeFileSync('/tmp/inventory-key-delete.sql', `DELETE FROM app_sessions WHERE user_id IN (SELECT id FROM app_users WHERE email = ${quote(email)} COLLATE NOCASE); DELETE FROM app_login_attempts; DELETE FROM app_users WHERE email = ${quote(email)} COLLATE NOCASE;`);
          NODE

          cleanup() {
            npx wrangler d1 execute norlow-repair-production --remote --yes --file=/tmp/inventory-key-delete.sql >/dev/null 2>&1 || true
            rm -f /tmp/inventory-key-* /tmp/login-payload.json /tmp/login.json /tmp/cookies.txt /tmp/public-key.json
          }
          trap cleanup EXIT
          npx wrangler d1 execute norlow-repair-production --remote --yes --file=/tmp/inventory-key-insert.sql >/dev/null
          sleep 3
          export KEY_EMAIL="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/inventory-key-user.json','utf8')).email)")"
          export KEY_PASSWORD="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/inventory-key-user.json','utf8')).password)")"
          node - <<'NODE' >/tmp/login-payload.json
          process.stdout.write(JSON.stringify({ email: process.env.KEY_EMAIL, password: process.env.KEY_PASSWORD }));
          NODE
          status="$(curl --silent --show-error -o /tmp/login.json -c /tmp/cookies.txt -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/login-payload.json "$SITE_URL/api/auth/login")"
          test "$status" = "200" || { cat /tmp/login.json; exit 1; }
          curl --fail --silent --show-error -b /tmp/cookies.txt "$SITE_URL/api/internal/import-public-key" -o /tmp/public-key.json
          node - <<'NODE'
          const payload = JSON.parse(require('fs').readFileSync('/tmp/public-key.json','utf8'));
          if (!payload.publicKey || !payload.publicKey.includes('BEGIN PUBLIC KEY')) throw new Error('public key missing');
          console.log('BEGIN_INVENTORY_IMPORT_PUBLIC_KEY');
          console.log(payload.publicKey.trim());
          console.log('END_INVENTORY_IMPORT_PUBLIC_KEY');
          NODE
