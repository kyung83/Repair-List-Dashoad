name: Maintenance sheet import 2026-11-04
on:
  push:
    branches: [ops/maintenance-sheet-import-20261104]
    paths:
      - '.github/workflows/maintenance-sheet-import.yml'
      - 'scripts/maintenance-sheet-oneoff/**'
permissions:
  contents: read
concurrency:
  group: norlow-maintenance-sheet-import-20261104
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'kyung83/Repair-List-Dashoad' && github.actor == 'kyung83'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Validate import scripts
        run: |
          node --check scripts/maintenance-sheet-oneoff/runner.mjs
          python -m py_compile scripts/maintenance-sheet-oneoff/plan_import.py scripts/maintenance-sheet-oneoff/sql_import.py
      - name: Execute approved ordered maintenance import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/maintenance-sheet-oneoff/runner.mjs
      - name: Retain encrypted verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-import-${{ github.run_id }}
          path: encrypted-report.json
          if-no-files-found: ignore
          retention-days: 1
