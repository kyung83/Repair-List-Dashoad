name: Protected EMDECS inventory sync

on:
  push:
    branches: [feat/emdecs-positive-inventory-import]
    paths: [ops/inventory-source-request.json]

permissions:
  contents: read

concurrency:
  group: norlow-emdecs-inventory-source-sync
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install project tooling
        run: npm ci
      - name: Resolve the existing production database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler d1 list --json > "$RUNNER_TEMP/inventory-databases.json"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const databases = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/inventory-databases.json', 'utf8'));
          const database = databases.find(item => item.name === 'norlow-repair-production');
          if (!database?.uuid) throw new Error('Expected production database was not found.');
          const template = JSON.parse(fs.readFileSync('wrangler.template.jsonc', 'utf8'));
          template.d1_databases.find(item => item.database_name === 'norlow-repair-production').database_id = database.uuid;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(template), { mode: 0o600 });
          NODE
      - name: Run the protected inventory operation
        run: node scripts/inventory-private-sync.mjs
      - name: Retain encrypted inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/protected-inventory-output/*.enc
          if-no-files-found: ignore
          retention-days: 3
